name: Publish Webhook Ingress Image

on:
  push:
    branches: [main]
    paths:
      - 'gateway/webhook-ingress/**'
      - '.github/workflows/webhook-ingress-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/mtp6linecoopbot-webhook-ingress"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          IMMUTABLE_TAG="sha-${SHORT_SHA}"

          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${IMAGE}:${IMMUTABLE_TAG}" \
            -t "${IMAGE}:main" \
            gateway/webhook-ingress

          docker push "${IMAGE}:${IMMUTABLE_TAG}"
          docker push "${IMAGE}:main"

          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${IMMUTABLE_TAG}")"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMMUTABLE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Release evidence
        run: |
          echo "Published: ${IMAGE}:${IMAGE_TAG}"
          echo "Digest: ${IMAGE_DIGEST}"
          echo "Commit: ${GITHUB_SHA}"
