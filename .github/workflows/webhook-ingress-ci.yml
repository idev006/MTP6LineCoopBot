name: Webhook Ingress CI

on:
  push:
    branches: [main]
    paths:
      - 'gateway/webhook-ingress/**'
      - '.github/workflows/webhook-ingress-ci.yml'
      - '.github/workflows/webhook-ingress-image.yml'
      - 'docs/ssot/security/WEBHOOK_INGRESS_SECURITY_STANDARD.md'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/webhook-ingress/**'
      - '.github/workflows/webhook-ingress-ci.yml'
      - '.github/workflows/webhook-ingress-image.yml'
      - 'docs/ssot/security/WEBHOOK_INGRESS_SECURITY_STANDARD.md'
  workflow_dispatch:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Syntax and tests
        working-directory: gateway/webhook-ingress
        run: npm run check

      - name: Privacy/security static guard
        shell: bash
        run: |
          set -e
          ! grep -RInE 'console\.(log|info|warn|error).*rawBody|logger\.(info|warn|error).*rawBody' gateway/webhook-ingress/src
          ! grep -RInE 'console\.(log|info|warn|error).*CHANNEL_SECRET|console\.(log|info|warn|error).*DOWNSTREAM_SECRET' gateway/webhook-ingress/src

      - name: Container build
        run: docker build -t mtp6-line-webhook-ingress:test gateway/webhook-ingress
