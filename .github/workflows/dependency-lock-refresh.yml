name: Dependency Lock Refresh

on:
  push:
    branches:
      - deps/ui-latest-stable-refresh
    paths:
      - 'webapp/package.json'
      - '.github/workflows/dependency-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: deps/ui-latest-stable-refresh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps(web): synchronize package lock"
          git push origin HEAD:deps/ui-latest-stable-refresh
