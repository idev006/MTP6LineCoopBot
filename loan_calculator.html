<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคำนวณสินเชื่อสหกรณ์ (Actual/365)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.21/dist/vue.global.prod.js"></script>

  <style>
    body { font-family: 'Chakra Petch', 'Sarabun', sans-serif; }
    .schedule-table { min-width: 760px; }
    .table-scroll-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-base-200 min-h-screen p-4 md:p-8">
<div id="app" class="max-w-5xl mx-auto">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="flex items-center gap-3 border-b pb-4">
        <div class="text-3xl">🏦</div>
        <div>
          <h1 class="text-2xl font-bold">ระบบคำนวณสินเชื่อ</h1>
          <p class="text-sm text-base-content/70">มาตรฐาน Actual/365 · คำนวณโดยระบบกลาง</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <label class="form-control">
          <span class="label-text">วงเงินกู้ (บาท)</span>
          <input class="input input-bordered text-right" type="number" v-model.number="form.loanAmount">
        </label>

        <label class="form-control">
          <span class="label-text">อัตราดอกเบี้ย (% ต่อปี)</span>
          <input class="input input-bordered text-right" type="number" step="0.01" v-model.number="form.interestRatePercent">
        </label>

        <label class="form-control">
          <span class="label-text">วิธีระบุการผ่อน</span>
          <select class="select select-bordered" v-model="form.calcMode">
            <option value="installment_count">จำนวนงวด</option>
            <option value="installment_amount">ยอดชำระต่องวด</option>
          </select>
        </label>

        <label class="form-control">
          <span class="label-text">{{ form.calcMode === 'installment_count' ? 'จำนวนงวด' : 'ยอดชำระต่องวด (บาท)' }}</span>
          <input class="input input-bordered text-right" type="number" v-model.number="form.calcValue">
        </label>

        <label class="form-control">
          <span class="label-text">วันที่เริ่มสัญญา</span>
          <input class="input input-bordered" type="date" v-model="form.startDate">
        </label>

        <label class="form-control">
          <span class="label-text">ประเภทการชำระ</span>
          <select class="select select-bordered" v-model="form.paymentType">
            <option value="equal_principal">ชำระเงินต้นเท่ากัน</option>
            <option value="equal_installment">ชำระยอดรวมเท่ากัน (PMT)</option>
          </select>
        </label>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary w-full md:w-auto" :disabled="loading" @click="calculate">
          <span v-if="loading" class="loading loading-spinner loading-sm"></span>
          {{ loading ? 'กำลังคำนวณ...' : 'คำนวณยอด' }}
        </button>
      </div>

      <div v-if="error" class="alert alert-error mt-4">
        <span>{{ error }}</span>
      </div>

      <template v-if="result">
        <div class="stats stats-vertical md:stats-horizontal shadow mt-6">
          <div class="stat">
            <div class="stat-title">เงินต้นรวม</div>
            <div class="stat-value text-lg">{{ money(result.totalPrincipal) }}</div>
          </div>
          <div class="stat">
            <div class="stat-title">ดอกเบี้ยรวม</div>
            <div class="stat-value text-lg">{{ money(result.totalInterest) }}</div>
          </div>
          <div class="stat">
            <div class="stat-title">ยอดชำระรวม</div>
            <div class="stat-value text-lg">{{ money(result.totalPayment) }}</div>
          </div>
        </div>

        <div class="table-scroll-wrap mt-6 border rounded-lg">
          <table class="table table-zebra table-sm schedule-table">
            <thead>
              <tr>
                <th>งวด</th>
                <th class="text-right">เงินต้นคงเหลือ</th>
                <th>วันที่หัก</th>
                <th class="text-right">วัน</th>
                <th class="text-right">ดอกเบี้ย</th>
                <th class="text-right">เงินต้นชำระ</th>
                <th class="text-right">รวมชำระ</th>
              </tr>
            </thead>
            <tbody>
              <template v-for="row in displayRows" :key="row.key">
                <tr v-if="row.kind === 'period'">
                  <td>{{ row.period }}</td>
                  <td class="text-right">{{ money(row.remainingPrincipal) }}</td>
                  <td>{{ thaiDate(row.date) }}</td>
                  <td class="text-right">{{ row.days }}</td>
                  <td class="text-right">{{ money(row.interest) }}</td>
                  <td class="text-right">{{ money(row.principal) }}</td>
                  <td class="text-right font-medium">{{ money(row.totalPayment) }}</td>
                </tr>
                <tr v-else class="font-bold bg-base-200">
                  <td colspan="2">รวมปี {{ row.year }}</td>
                  <td></td>
                  <td></td>
                  <td class="text-right">{{ money(row.interest) }}</td>
                  <td class="text-right">{{ money(row.principal) }}</td>
                  <td class="text-right">{{ money(row.totalPayment) }}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="text-xs text-base-content/60 mt-2">Contract: {{ result.contractVersion }}</p>
      </template>
    </div>
  </div>
</div>

<script src="liff/js/config.js"></script>
<script>
const { createApp, reactive, ref, computed } = Vue;

createApp({
  setup() {
    const form = reactive({
      loanAmount: 500000,
      interestRatePercent: 5,
      calcMode: 'installment_count',
      calcValue: 50,
      startDate: '2026-09-01',
      paymentType: 'equal_principal'
    });

    const result = ref(null);
    const loading = ref(false);
    const error = ref('');

    const apiUrl = () =>
      String(CONFIG.API_BASE_URL || '').replace(/\/+$/, '') + '/api/loan/calculate';

    async function calculate() {
      loading.value = true;
      error.value = '';
      result.value = null;
      try {
        const response = await fetch(apiUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...form })
        });
        if (!response.ok) throw new Error('ไม่สามารถเชื่อมต่อระบบคำนวณได้');

        const envelope = await response.json();
        if (!envelope || envelope.ok !== true) {
          throw new Error(envelope?.error?.message || 'ข้อมูลสำหรับคำนวณไม่ถูกต้อง');
        }
        result.value = envelope.data;
      } catch (e) {
        error.value = e && e.message ? e.message : 'เกิดข้อผิดพลาดในการคำนวณ';
      } finally {
        loading.value = false;
      }
    }

    // Presentation-only aggregation. All loan financial calculations come from backend.
    const displayRows = computed(() => {
      if (!result.value || !Array.isArray(result.value.schedule)) return [];
      const rows = [];
      let currentYear = null;
      let yearly = null;

      function flushYear() {
        if (!yearly) return;
        rows.push({
          kind: 'summary',
          key: 'y-' + yearly.year,
          year: yearly.year,
          interest: yearly.interest,
          principal: yearly.principal,
          totalPayment: yearly.totalPayment
        });
      }

      for (const row of result.value.schedule) {
        const year = String(row.date || '').slice(0, 4);
        if (currentYear !== null && year !== currentYear) {
          flushYear();
          yearly = null;
        }
        if (!yearly) {
          currentYear = year;
          yearly = { year, interest: 0, principal: 0, totalPayment: 0 };
        }
        yearly.interest += Number(row.interest || 0);
        yearly.principal += Number(row.principal || 0);
        yearly.totalPayment += Number(row.totalPayment || 0);
        rows.push({ ...row, kind: 'period', key: 'p-' + row.period });
      }
      flushYear();
      return rows;
    });

    const money = value => Number(value || 0).toLocaleString('th-TH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    const thaiDate = value => {
      const m = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? m[3] + '/' + m[2] + '/' + m[1] : '-';
    };

    return { form, result, loading, error, calculate, displayRows, money, thaiDate };
  }
}).mount('#app');
</script>
</body>
</html>
